<div class="auth-wrap">
  <a href="/" class="auth-brand">PIMH <span>Academy</span></a>
  <div class="auth-card" style="text-align:center;">
    <div style="font-size: 2.2rem; margin-bottom: 0.75rem;">✉️</div>
    <h1>Verify Your Email</h1>
    <p class="sub" style="margin-bottom: 1.5rem;">We've sent a verification link to your email address. Please click that link to activate your account and unlock your portal.</p>
    <button type="button" id="resendBtn" class="btn-primary" style="width:100%;">Resend Verification Email</button>
    <p id="resendMsg" style="margin-top: 1rem; color: #2E5A36; font-weight: 600; display: none;">Verification email sent! Please check your inbox and spam folder.</p>
    <div class="auth-error" id="resendErr"></div>
  </div>
  <div class="auth-footer">
    <a href="#" id="verifyLogoutLink">Use a different account</a> · <a href="/">Back to site</a>
  </div>
</div>
<script>
document.getElementById('resendBtn').addEventListener('click', function() {
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Sending...';
  fetch('/api/auth/resend-verification', { method: 'POST' })
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Resend Verification Email';
      if (res.ok) {
        document.getElementById('resendMsg').style.display = 'block';
        document.getElementById('resendErr').classList.remove('show');
      } else {
        var err = document.getElementById('resendErr');
        err.textContent = res.data.error || 'Failed to resend verification email.';
        err.classList.add('show');
      }
    });
});
document.getElementById('verifyLogoutLink').addEventListener('click', function(e) {
  e.preventDefault();
  fetch('/api/auth/logout', { method: 'POST' }).then(function() {
    window.location.href = '/login';
  });
});
</script>
