<div class="auth-card">
  <div class="auth-header">
    <div style="font-size: 2rem; margin-bottom: 1rem;">✉️</div>
    <h1 style="color:var(--c-red-500); font-weight:700;">Action Required</h1>
    <p>Please check your email and click the verification link to unlock your dashboard.</p>
  </div>
  <div style="margin-top: 1.5rem; text-align: center;">
    <button id="resendBtn" class="btn btn-dark" style="width:100%">Resend Verification Email</button>
  </div>
  <p id="resendMsg" style="margin-top: 1rem; color: var(--c-green-500); text-align: center; display: none;">Verification email resent!</p>
</div>
<script>
document.getElementById('resendBtn').addEventListener('click', function() {
  fetch('/api/auth/resend-verification', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      if(data.ok) {
        document.getElementById('resendMsg').style.display = 'block';
      } else {
        alert(data.error || 'Failed to resend');
      }
    });
});
</script>
